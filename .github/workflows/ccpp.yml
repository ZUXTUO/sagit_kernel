name: C/C++ CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: prepare boot
      run: cd mkbootimg_tools && rm -rf boot && ./mkboot boot.img boot
    - name: clean boot
      run: git reset --hard
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo 'export PATH=$HOME/.uv/bin:$PATH' >> $GITHUB_ENV
        source $GITHUB_ENV
    - name: Install Python2
      run: |
        uv python install 2.7.18
        uv venv --python 2.7.18
    - name: make
      run: source .venv/bin/activate && bash build-kernel.sh
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: V1.6
        path: READY-KERNEL/
    - name: Upload module artifact
      uses: actions/upload-artifact@v4
      with:
        name: modules
        path: sagit_wlan_magisk/
