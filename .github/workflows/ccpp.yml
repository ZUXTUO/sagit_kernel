name: C/C++ CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: python:2.7 
    steps:
    - uses: actions/checkout@v2
    - name: prepare boot
      run: cd mkbootimg_tools && rm -rf boot && ./mkboot boot.img boot
    - name: clean boot
      run: git reset --hard
    - name: install build
      run: apt-get install -y build-essential bc libncurses-dev bison flex
    - name: make
      run: bash build-kernel.sh
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: V1.6
        path: READY-KERNEL/
    - name: Upload module artifact
      uses: actions/upload-artifact@v4
      with:
        name: modules
        path: sagit_wlan_magisk/
